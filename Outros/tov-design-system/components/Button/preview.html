<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div id="root"></div>
<script>
  var T = window.Tov, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'tv-row'},
 h(T.Button,{variant:'brand',icon:'calendar'},'Agendar reunião'),
 h(T.Button,{variant:'primary'},'Salvar'),
 h(T.Button,{variant:'secondary',icon:'message'},'Enviar mensagem'),
 h(T.Button,{variant:'ghost'},'Cancelar'),
 h(T.Button,{variant:'danger',size:'sm'},'Excluir'),
 h(T.Button,{variant:'secondary',size:'sm',iconOnly:true,icon:'close','aria-label':'Fechar'})));
</script>
</body>
</html>
